# build.yml - 可复用的 Rust 编译工作流
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: '要编译的 crates.io 版本号'
        required: true
        type: string
      publish_release:
        description: '是否发布 Release'
        required: false
        default: true
        type: boolean
    secrets:
      GH_TOKEN:
        required: false

jobs:
  build:
    name: Build ${{ matrix.target_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            target_name: windows-x64
            archive_ext: zip
            exe: .exe

          # Linux x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            target_name: linux-x64
            archive_ext: tar.gz
            exe: ""

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            target_name: linux-arm64
            archive_ext: tar.gz
            exe: ""
            cross: true

          # macOS x64
          - target: x86_64-apple-darwin
            os: macos-13
            target_name: macos-x64
            archive_ext: tar.gz
            exe: ""

          # macOS ARM64
          - target: aarch64-apple-darwin
            os: macos-14
            target_name: macos-arm64
            archive_ext: tar.gz
            exe: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install cargo-audit (optional)
        run: cargo install cargo-audit

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Download and extract source from crates.io
        run: |
          echo "Downloading rust-hf-downloader v${{ inputs.version }} from crates.io..."
          curl -L "https://crates.io/api/v1/crates/rust-hf-downloader/${{ inputs.version }}/download" -o source.tar.gz
          tar -xzf source.tar.gz
          # crates.io 解压后目录名格式: rust-hf-downloader-{version}
          mv "rust-hf-downloader-${{ inputs.version }}" source

      - name: Rename source to Cargo.toml context
        run: |
          # 确保 Cargo.toml 在正确位置
          ls -la source/

      - name: Build release binary
        working-directory: source
        run: |
          echo "Building for target: ${{ matrix.target }}"
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify binary exists
        working-directory: source
        shell: bash
        run: |
          BINARY_PATH="target/${{ matrix.target }}/release/rust-hf-downloader${{ matrix.exe }}"
          if [ -f "$BINARY_PATH" ]; then
            echo "✅ Binary found: $BINARY_PATH"
            ls -lh "$BINARY_PATH"
          else
            echo "❌ Binary not found at expected path"
            echo "Contents of target/${{ matrix.target }}/release/:"
            ls -la "target/${{ matrix.target }}/release/" || echo "Directory not found"
            exit 1
          fi

      - name: Package (Linux/macOS)
        if: matrix.archive_ext == 'tar.gz'
        working-directory: source
        run: |
          BINARY_PATH="target/${{ matrix.target }}/release/rust-hf-downloader${{ matrix.exe }}"
          ARCHIVE_NAME="rust-hf-downloader-v${{ inputs.version }}-${{ matrix.target_name }}.tar.gz"
          tar -czf "../${ARCHIVE_NAME}" -C "target/${{ matrix.target }}/release" "rust-hf-downloader${{ matrix.exe }}"
          cd ..
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "Archive: ${ARCHIVE_NAME}"
          cat "${ARCHIVE_NAME}.sha256"

      - name: Package (Windows)
        if: matrix.archive_ext == 'zip'
        working-directory: source
        shell: pwsh
        run: |
          $binaryPath = "target/${{ matrix.target }}/release/rust-hf-downloader${{ matrix.exe }}"
          $archiveName = "rust-hf-downloader-v${{ inputs.version }}-${{ matrix.target_name }}.zip"
          Compress-Archive -Path $binaryPath -DestinationPath "../$archiveName"
          Set-Location ..
          $hash = (Get-FileHash -Algorithm SHA256 $archiveName).Hash.ToLower()
          Set-Content -Path "${archiveName}.sha256" -Value "$hash  $archiveName"
          Write-Host "Archive: $archiveName"
          Write-Host "SHA256: $hash  $archiveName"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-hf-downloader-${{ matrix.target_name }}
          path: |
            rust-hf-downloader-v${{ inputs.version }}-${{ matrix.target_name }}.*
          retention-days: 5

  create-release:
    name: Create Release
    needs: build
    if: inputs.publish_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: rust-hf-downloader v${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
