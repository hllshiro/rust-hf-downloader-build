# manual-build.yml - 手动触发编译并发布 Release
name: Manual Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.4.0）。留空则自动检测最新版本。'
        required: false
        type: string
      publish_release:
        description: '发布 Release'
        required: false
        default: true
        type: boolean

jobs:
  detect-version:
    name: Detect Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Detect version
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using specified version: $VERSION"
          else
            VERSION=$(curl -s "https://crates.io/api/v1/crates/rust-hf-downloader" | jq -r '.crate.max_stable_version')
            echo "Auto-detected latest version: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version exists on crates.io
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/rust-hf-downloader/${{ steps.detect.outputs.version }}")
          if [ "$STATUS" != "200" ]; then
            echo "❌ Version ${{ steps.detect.outputs.version }} not found on crates.io (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Version ${{ steps.detect.outputs.version }} confirmed on crates.io"

  build:
    name: Build
    needs: detect-version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.detect-version.outputs.version }}

  create-release:
    name: Create Release
    needs: [detect-version, build]
    if: github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rust-hf-downloader-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect-version.outputs.version }}
          name: rust-hf-downloader v${{ needs.detect-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
