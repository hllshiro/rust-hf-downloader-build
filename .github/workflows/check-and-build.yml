# check-and-build.yml - 自动检测 crates.io 新版本并编译发布
name: Check & Build

on:
  schedule:
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      force_build:
        description: '强制编译（忽略版本检查）'
        required: false
        default: 'false'
        type: boolean

jobs:
  check:
    name: Check crates.io
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check crates.io for latest version
        id: check
        run: |
          LATEST_VERSION=$(curl -s "https://crates.io/api/v1/crates/rust-hf-downloader" | jq -r '.crate.max_stable_version')
          echo "Latest version on crates.io: $LATEST_VERSION"

          LAST_BUILT=$(cat .last-built-version 2>/dev/null || echo "0.0.0")
          echo "Last built version: $LAST_BUILT"

          if [ "$LATEST_VERSION" != "$LAST_BUILT" ] || [ "${{ github.event.inputs.force_build }}" = "true" ]; then
            echo "New version detected! $LAST_BUILT -> $LATEST_VERSION"
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "Already built latest version."
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Update last built version
        if: steps.check.outputs.should_build == 'true'
        run: |
          echo "${{ steps.check.outputs.version }}" > .last-built-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-built-version
          git commit -m "chore: update last-built-version to ${{ steps.check.outputs.version }}"
          git push

  build:
    name: Build
    needs: check
    if: needs.check.outputs.should_build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.check.outputs.version }}

  create-release:
    name: Create Release
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rust-hf-downloader-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: rust-hf-downloader v${{ needs.check.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
